<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>dcness design canvas</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; }
    .canvas { cursor: grab; user-select: none; }
  </style>
</head>
<body>
  <!--
    canvas-design 책임:
    1. PICK 확정 후 메인이 이 파일에 한 줄을 등록한다 — 좌표 X (canvas.js auto-layout):
         <iframe data-frame-id="<screen-id>" src="<screen-id>.html"></iframe>
       사용자가 위치 명시 요청 시만 data-pos="<col>,<row>" 박음.
    2. viewport 다른 frame:
         <iframe data-frame-id="..." data-viewport="desktop" src="..."></iframe>
    3. Figma형 플로우 보드가 필요하면 screen-node 로 2D 배치 + 캡션을 선언한다:
         <div class="screen-node" data-node-id="<screen-id>" data-pos="<col>,<row>"
              data-title="화면 제목" data-desc="화면 설명" data-states="기본 / 빈 / 로딩"
              data-h="900">
           <iframe src="<screen-id>.html"></iframe>
         </div>
    4. 화살표는 optional — 사용자 명시 요청 시만 추가:
         <svg class="flow-arrows">
           <path data-from="login" data-to="payment-confirm" data-label="로그인 후" data-bend="0"/>
         </svg>
  -->
  <div class="canvas">
    <!-- 확정 화면 iframe 들 — canvas-design 승격 단계에서 메인이 추가 -->

    <!-- 화살표 (optional) -->
    <!--
    <svg class="flow-arrows">
      <path data-from="" data-to="" data-label=""/>
    </svg>
    -->
  </div>

  <script defer src="_lib/canvas.js"></script>
  <script defer src="_lib/show-ids.js"></script>
</body>
</html>
