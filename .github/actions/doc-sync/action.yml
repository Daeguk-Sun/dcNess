name: 'dcness doc-sync validation'
description: 'Validate generated docs/index.md epic/module tables and /design artifact structure.'
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '20'

    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'

    - name: Validate docs/index.md epic/module tables
      shell: bash
      run: |
        set -euo pipefail
        node "${{ github.action_path }}/../../../scripts/aggregate_index_map.mjs" --check

    - name: Validate /design artifact structure
      shell: bash
      run: |
        set -euo pipefail
        node "${{ github.action_path }}/../../../scripts/check_design_artifact_structure.mjs"

    - name: Validate design-variants generated views
      shell: bash
      run: |
        set -euo pipefail
        DESIGN_ROOT="docs/design-variants"
        if ! compgen -G "$DESIGN_ROOT/screens/*.html" >/dev/null; then
          exit 0
        fi
        DESIGN_SCRIPTS="${{ github.action_path }}/../../../scripts/design"
        node "$DESIGN_SCRIPTS/build-journey-boards.mjs" --project-root . --check
        node "$DESIGN_SCRIPTS/build-screen-states.mjs" --project-root . --check
        node "$DESIGN_SCRIPTS/build-design-index.mjs" --project-root . --check
