# GitHub Actions — git-spec 브랜치명·PR 제목 형식 검증 게이트
# (workflow 파일명 / job 이름 `git-naming-spec gate` 는 기존 활성 프로젝트의 branch protection 호환 위해 보존)
#
# 규칙 정의: docs/plugin/git-spec.md (SSOT)
# 본 dcness self repo 는 자기 composite action (.github/actions/git-naming) 을 dogfooding.
# 외부 활성화 프로젝트는 init-dcness 가 묻고 Y 답변 시 thin yml 을 사용자 repo 에 배포 — 그 yml 은
# `uses: Daeguk-Sun/dcNess/.github/actions/git-naming@main` 1줄로 동일 검증.

name: git-naming-validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  naming:
    name: git-naming-spec gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Validate branch + PR title via composite action
        uses: ./.github/actions/git-naming
        with:
          branch: ${{ github.head_ref }}
          title: ${{ github.event.pull_request.title }}
