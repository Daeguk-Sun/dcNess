name: doc-sync
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  doc-sync:
    name: doc-sync gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Validate docs/index.md epic/module tables
        run: node .github/ci-checks/scripts/aggregate_index_map.mjs --check

      - name: Validate /design artifact structure
        run: node .github/ci-checks/scripts/check_design_artifact_structure.mjs

      - name: Validate design-variants generated views
        run: |
          set -euo pipefail
          if ! compgen -G "docs/design-variants/screens/*.html" >/dev/null; then
            exit 0
          fi
          DESIGN_SCRIPTS=".github/ci-checks/scripts/design"
          node "$DESIGN_SCRIPTS/build-journey-boards.mjs" --project-root . --check
          node "$DESIGN_SCRIPTS/build-screen-states.mjs" --project-root . --check
          node "$DESIGN_SCRIPTS/build-design-index.mjs" --project-root . --check
